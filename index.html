<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS | UB </title>
    <style>
        /* Cyber Neon Theme (Purple, Light Blue, Pink) */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #0d0614; 
            color: #ffffff; 
            padding: 20px; 
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Matrix Particle Canvas Layer */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
        
        /* Content Wrapper Above Canvas */
        .main-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Banner Header Section */
        header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding: 30px 10px; 
            background: linear-gradient(180deg, rgba(29, 21, 48, 0.8) 0%, rgba(18, 12, 31, 0.9) 100%); 
            border-radius: 12px; 
            border-bottom: 3px solid #ff007f; 
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        h1 { 
            font-size: 2.8rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: #ffffff; 
            letter-spacing: 1px; 
            text-shadow: 2px 2px 8px rgba(255, 0, 127, 0.4); 
        }
        h1 span { 
            background: linear-gradient(45deg, #00d2ff, #ff007f); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        header p { 
            color: #bcaed4; 
            font-size: 1.1rem; 
            margin-top: 8px; 
        }

        /* Navigation Control Panel */
        .controls { 
            max-width: 600px; 
            margin: 0 auto 20px auto; 
            display: flex; 
            gap: 10px; 
        }
        .search-box { 
            flex: 1; 
            padding: 14px 20px; 
            background-color: rgba(29, 21, 48, 0.9); 
            border: 2px solid #3c2d59; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 1rem; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s; 
            backdrop-filter: blur(4px);
        }
        .search-box:focus { 
            border-color: #00d2ff; 
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); 
        }
        .back-btn { 
            padding: 0 20px; 
            background: linear-gradient(45deg, #ff007f, #00d2ff); 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            display: none; 
        }

        /* Dynamic Filtering Category Tabs */
        .tabs-container { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            max-width: 750px; 
            margin: 0 auto 30px auto; 
            flex-wrap: wrap; 
        }
        .tab-btn { 
            padding: 10px 20px; 
            background-color: rgba(29, 21, 48, 0.9); 
            border: 2px solid #3c2d59; 
            border-radius: 20px; 
            color: #bcaed4; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            backdrop-filter: blur(4px);
        }
        .tab-btn:hover { 
            border-color: #00d2ff; 
            color: #fff; 
        }
        .tab-btn.active { 
            background: linear-gradient(45deg, #ff007f, #00d2ff); 
            border-color: transparent; 
            color: #fff; 
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3); 
        }

        /* Arcade Grid System */
        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }
        .game-card { 
            background-color: rgba(29, 21, 48, 0.85); 
            border-radius: 8px; 
            overflow: hidden; 
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; 
            cursor: pointer; 
            border: 2px solid transparent; 
            display: flex; 
            flex-direction: column; 
            backdrop-filter: blur(4px);
        }
        .game-card:hover { 
            transform: scale(1.04); 
            border-color: #ff007f; 
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3); 
        }
        
        /* Grid Graphical Thumbnails */
        .thumbnail { 
            width: 100%; 
            height: 150px; 
            background: linear-gradient(135deg, #2b1f47, #1d1530); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3.5rem; 
            overflow: hidden; 
            position: relative; 
        }
        
        /* Game Info Text Labels */
        .game-info { 
            padding: 12px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1rem; 
            background-color: rgba(22, 15, 38, 0.9); 
            border-top: 1px solid #1d1530; 
            color: #00d2ff; 
            margin-top: auto; 
        }
        .game-card:hover .game-info { 
            color: #ff007f; 
        }

        /* Game IFrame Screen Wrapper */
        .game-frame-container { 
            display: none; 
            width: 100%;a
            background: #1d1530; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 2px solid #ff007f; 
        }
        iframe { 
            width: 100%; 
            height: 600px; 
            border: none; 
            border-radius: 6px; 
            background-color: #000; 
        }
    </style>
</head>

        const canvas = document.getElementById('bgCanvas');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const particles = [];

        const colors = ['rgba(255, 0, 127, 0.15)', 'rgba(0, 210, 255, 0.15)', 'rgba(140, 80, 255, 0.15)'];

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 1.5 + 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

emCategory = items[i].getAttribute('data-category');const matchesSearch = title.includes(query);const matchesTab = (currentCategory === 'all' || itemCategory === currentCategory);if (matchesSearch && matchesTab) {items[i].style.display = "flex";} else {items[i].style.display = "none";}}}
