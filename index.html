<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub | Unblocked Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* ==========================================================================
           1. THEME VARIABLES CONTROL CENTER (Class-Based Structure)
           ========================================================================== */
        
        /* --- NORMAL (Default Purple, Light Blue, Pink) --- */
        body, body.theme-normal {
            --bg-color: #0d0614;
            --header-bg: linear-gradient(180deg, rgba(29, 21, 48, 0.8) 0%, rgba(18, 12, 31, 0.9) 100%);
            --accent-border: #ff007f;
            --accent-glow: 0 0 15px rgba(255, 0, 127, 0.3);
            --gradient-start: #00d2ff;
            --gradient-end: #ff007f;
            --subtext-color: #bcaed4;
            --input-bg: rgba(29, 21, 48, 0.9);
            --border-color: #3c2d59;
            --card-bg: rgba(29, 21, 48, 0.85);
            --info-bg: rgba(22, 15, 38, 0.9);
            --info-text: #00d2ff;
        }

        /* --- DARK THEME --- */
        body.theme-dark {
            --bg-color: #050505;
            --header-bg: linear-gradient(180deg, #111 0%, #050505 100%);
            --accent-border: #444444;
            --accent-glow: none;
            --gradient-start: #ffffff;
            --gradient-end: #555555;
            --subtext-color: #777777;
            --input-bg: #111111;
            --border-color: #222222;
            --card-bg: #111111;
            --info-bg: #0a0a0a;
            --info-text: #ffffff;
        }

        /* --- HALLOWEEN THEME --- */
        body.theme-halloween {
            --bg-color: #140700;
            --header-bg: linear-gradient(180deg, rgba(41, 18, 0, 0.8) 0%, rgba(20, 9, 0, 0.9) 100%);
            --accent-border: #ff6600;
            --accent-glow: 0 0 15px rgba(255, 102, 0, 0.4);
            --gradient-start: #ffaa00;
            --gradient-end: #ff3300;
            --subtext-color: #d4a373;
            --input-bg: rgba(41, 18, 0, 0.9);
            --border-color: #5c2c00;
            --card-bg: rgba(41, 18, 0, 0.85);
            --info-bg: rgba(26, 11, 0, 0.9);
            --info-text: #ffaa00;
        }

        /* --- WINTER THEME --- */
        body.theme-winter {
            --bg-color: #0b1320;
            --header-bg: linear-gradient(180deg, rgba(24, 38, 59, 0.8) 0%, rgba(11, 19, 32, 0.9) 100%);
            --accent-border: #00bfff;
            --accent-glow: 0 0 15px rgba(0, 191, 255, 0.4);
            --gradient-start: #e0f7fa;
            --gradient-end: #80deea;
            --subtext-color: #a9c2d0;
            --input-bg: rgba(24, 38, 59, 0.9);
            --border-color: #1a365d;
            --card-bg: rgba(24, 38, 59, 0.85);
            --info-bg: rgba(15, 26, 42, 0.9);
            --info-text: #00bfff;
        }

        /* --- CHRISTMAS THEME --- */
        body.theme-christmas {
            --bg-color: #07140b;
            --header-bg: linear-gradient(180deg, rgba(13, 41, 21, 0.8) 0%, rgba(7, 20, 11, 0.9) 100%);
            --accent-border: #ff0000;
            --accent-glow: 0 0 15px rgba(255, 0, 0, 0.4);
            --gradient-start: #ff3333;
            --gradient-end: #00cc44;
            --subtext-color: #a3d4b0;
            --input-bg: rgba(13, 41, 21, 0.9);
            --border-color: #0a3314;
            --card-bg: rgba(13, 41, 21, 0.85);
            --info-bg: rgba(8, 28, 14, 0.9);
            --info-text: #ff3333;
        }

        /* --- EVIL THEME --- */
        body.theme-evil {
            --bg-color: #0f0000;
            --header-bg: linear-gradient(180deg, rgba(36, 0, 0, 0.8) 0%, rgba(15, 0, 0, 0.9) 100%);
            --accent-border: #ff0000;
            --accent-glow: 0 0 15px rgba(255, 0, 0, 0.5);
            --gradient-start: #330000;
            --gradient-end: #ff0000;
            --subtext-color: #8a6c6c;
            --input-bg: rgba(36, 0, 0, 0.9);
            --border-color: #5c0000;
            --card-bg: rgba(36, 0, 0, 0.85);
            --info-bg: rgba(20, 0, 0, 0.9);
            --info-text: #ff0000;
        }

        /* ==========================================================================
           2. INTERFACE LAYOUT
           ========================================================================== */
        body { 
            background-color: var(--bg-color); 
            color: #ffffff; 
            padding: 20px; 
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        .main-wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }

        /* Settings Toggle Button */
        .settings-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: var(--header-bg);
            border: 2px solid var(--accent-border);
            border-radius: 50%;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .settings-toggle-btn:hover { transform: rotate(45deg); }

        header { 
            text-align: center; margin-bottom: 30px; padding: 30px 10px; 
            background: var(--header-bg); border-radius: 12px; border-bottom: 3px solid var(--accent-border); 
            backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 2.8rem; font-weight: 800; text-transform: uppercase; color: #ffffff; letter-spacing: 1px; }
        h1 span { background: linear-gradient(45deg, var(--gradient-start), var(--gradient-end)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--subtext-color); font-size: 1.1rem; margin-top: 8px; }

        .controls { max-width: 600px; margin: 0 auto 20px auto; display: flex; gap: 10px; }
        .search-box { 
            flex: 1; padding: 14px 20px; background-color: var(--input-bg); border: 2px solid var(--border-color); 
            border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: all 0.3s; backdrop-filter: blur(4px);
        }
        .search-box:focus { border-color: var(--gradient-start); }
        .back-btn { padding: 0 20px; background: linear-gradient(45deg, var(--gradient-end), var(--gradient-start)); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; display: none; }

        .tabs-container { display: flex; justify-content: center; gap: 10px; max-width: 750px; margin: 0 auto 30px auto; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; background-color: var(--input-bg); border: 2px solid var(--border-color); border-radius: 20px; color: var(--subtext-color); font-weight: 600; cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(4px); }
        .tab-btn:hover { border-color: var(--gradient-start); color: #fff; }
        .tab-btn.active { background: linear-gradient(45deg, var(--gradient-end), var(--gradient-start)); border-color: transparent; color: #fff; box-shadow: var(--accent-glow); }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; width: 100%; }
        .game-card { background-color: var(--card-bg); border-radius: 8px; overflow: hidden; transition: all 0.2s; cursor: pointer; border: 2px solid transparent; display: flex; flex-direction: column; backdrop-filter: blur(4px); }
        .game-card:hover { transform: scale(1.04); border-color: var(--accent-border); box-shadow: var(--accent-glow); }
        .thumbnail { width: 100%; height: 150px; background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2)); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; overflow: hidden; position: relative; }
        .game-info { padding: 12px; text-align: center; font-weight: bold; font-size: 1rem; background-color: var(--info-bg); border-top: 1px solid var(--border-color); color: var(--info-text); margin-top: auto; }
        .game-card:hover .game-info { color: var(--accent-border); }

        .game-frame-container { display: none; width: 100%; background: var(--input-bg); padding: 10px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--accent-border); }
        iframe { width: 100%; height: 600px; border: none; border-radius: 6px; background-color: #000; }

        /* Settings Modal Panel Overlays */
        .settings-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 15, 0.7); backdrop-filter: blur(8px); z-index: 10000;
            align-items: center; justify-content: center;
        }
        .settings-content {
            background: #160f26; border: 2px solid var(--accent-border); border-radius: 12px;
            width: 90%; max-width: 450px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 20px;
        }
        .settings-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.3rem; color: #00d2ff; }
        .close-modal { background: none; border: none; color: #ff007f; font-size: 1.4rem; cursor: pointer; }
        
        .settings-group { display: flex; flex-direction: column; gap: 8px; }
        .settings-group label { font-size: 0.9rem; font-weight: 600; color: #bcaed4; text-transform: uppercase; letter-spacing: 0.5px; }
