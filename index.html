<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geady Hub & Unblocked Games</title>
    <style>
        /* Roblox Dashboard Theme */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #191b1f; color: #ffffff; padding: 20px; }
        
        /* Banner Header */
        header { text-align: center; margin-bottom: 30px; padding: 30px 10px; background: linear-gradient(180deg, #252831 0%, #191b1f 100%); border-radius: 12px; border-bottom: 3px solid #f68b1f; }
        h1 { font-size: 2.8rem; font-weight: 800; text-transform: uppercase; color: #ffffff; letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        h1 span { color: #f68b1f; } /* Accented text */
        header p { color: #b8bac2; font-size: 1.1rem; margin-top: 8px; }

        /* Navigation Control Panel */
        .controls { max-width: 600px; margin: 0 auto 30px auto; display: flex; gap: 10px; }
        .search-box { flex: 1; padding: 14px 20px; background-color: #252831; border: 2px solid #393e4d; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        .search-box:focus { border-color: #f68b1f; }
        .back-btn { padding: 0 20px; background-color: #f68b1f; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; display: none; }

        /* The Virtual Arcade Grid */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .game-card { background-color: #252831; border-radius: 8px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; cursor: pointer; border: 2px solid transparent; }
        .game-card:hover { transform: scale(1.04); border-color: #f68b1f; }
        
        /* Thumbnail Blocks */
        .thumbnail { width: 100%; height: 150px; background: #393e4d; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; overflow: hidden; position: relative; }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Game Description Info */
        .game-info { padding: 12px; text-align: center; font-weight: bold; font-size: 1rem; background-color: #1f2229; border-top: 1px solid #252831; }

        /* Embed Screen Frame */
        .game-frame-container { display: none; max-width: 1000px; margin: 0 auto; background: #252831; padding: 10px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        iframe { width: 100%; height: 600px; border: none; border-radius: 6px; background-color: #000; }
    </style>
</head>
<body>

    <header>
        <h1>Geady <span>Unblocked</span></h1>
        <p>Instant Browser Arcade Platform (jago is gay)</p>
    </header>

    <div class="controls">
        <input type="text" id="search" class="search-box" placeholder="Search unblocked options..." onkeyup="filterGames()">
        <button id="backBtn" class="back-btn" onclick="closeGame()">↩ Back</button>
    </div>

    <!-- Web Player IFrame Wrapper -->
    <div class="game-frame-container" id="frameContainer">
        <iframe id="gameIframe" src=""></iframe>
    </div>

    <!-- Navigation Hub Grid Grid -->
    <div class="games-grid" id="gamesGrid">
        
        <!-- Game Unit 1 (Using embedded frame injection) -->
        <div class="game-card" onclick="playGame('https://rbxcdn.com')">
            <div class="thumbnail">🎮</div>
            <div class="game-info">Roblox Client</div>
        </div>

        <!-- Game Unit 2 -->
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="thumbnail">🏈</div>
            <div class="game-info">Retro Bowl</div>
        </div>

        <!-- Game Unit 3 -->
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="thumbnail">🟢</div>
            <div class="game-info">Slope 3D</div>
        </div>

    </div>

    <script>
        // Launches the target link seamlessly in the custom IFrame viewport
        function playGame(url) {
            document.getElementById('gamesGrid').style.display = 'none';
            document.getElementById('search').style.display = 'none';
            document.getElementById('frameContainer').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('gameIframe').src = url;
        }

        // Exits current game and brings player back to the selection dashboard
        function closeGame() {
            document.getElementById('gamesGrid').style.display = 'grid';
            document.getElementById('search').style.display = 'block';
            document.getElementById('frameContainer').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('gameIframe').src = '';
        }

        // Live grid layout filter matching user search queries
        function filterGames() {
            const query = document.getElementById('search').value.toLowerCase();
            const items = document.getElementsByClassName('game-card');
            for (let i = 0; i < items.length; i++) {
                const title = items[i].querySelector('.game-info').innerText.toLowerCase();
                items[i].style.display = title.includes(query) ? "block" : "none";
            }
        }
    </script>
</body>
</html>
